name: Option price history

# Daily closes for every option contract (nearest expiries) from NSE's F&O bhavcopy,
# for the per-strike price charts. Published to the "opt" branch (one snapshot, force-pushed).
on:
  schedule:
    - cron: "15 13 * * 1-5"   # 6:45 PM IST
    - cron: "45 15 * * 1-5"   # 9:15 PM IST (in case NSE posts the file late)
    - cron: "30 1 * * 2-6"    # 7:00 AM IST next morning
  push:
    branches: [main]
    paths: [".github/workflows/opthist.yml", "scripts/opthist.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opthist
  cancel-in-progress: true

jobs:
  opt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/opthist.py
      - name: Publish to the opt branch
        run: |
          cd opt && git init -q -b opt && git add -A
          git -c user.name=marketvedapro-bot -c user.email=marketvedapro-bot@users.noreply.github.com commit -q -m "Option history $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" opt
