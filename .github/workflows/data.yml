name: Update data

# Open pages read data/live.json straight from this repository, so a data update
# only needs a commit. During market hours one run keeps updating prices about every minute
# (full update incl. IBJA, GMP and news every ~5 minutes)
# until the close, so it doesn't depend on GitHub starting a new run each time.
on:
  schedule:
    - cron: "40 3 * * 1-5"      # 9:10 AM IST: start the market-hours loop
    - cron: "10 6 * * 1-5"      # 11:40 AM IST: restart the loop (covers a delayed or failed morning start)
    - cron: "0 0-2,11-23/2 * * *" # every 2 hours outside market hours: one update (metals, GMP, news)
  push:
    branches: [main]
    paths: [".github/workflows/data.yml", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update (prices ~every minute, full every 5th pass, until 3:45 PM IST)
        run: |
          git config user.name "marketvedapro-bot"
          git config user.email "marketvedapro-bot@users.noreply.github.com"
          i=0
          while true; do
            if [ $((i % 5)) -eq 0 ]; then python scripts/update.py || true; else python scripts/update.py --fast || true; fi
            i=$((i+1))
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "Data update $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')"
              git pull -q --rebase -X theirs || true
              git push -q || true
            fi
            NOW=$(TZ=Asia/Kolkata date +%H%M); DOW=$(TZ=Asia/Kolkata date +%u)
            if [ "$DOW" -ge 6 ] || [ "$NOW" -lt 0900 ] || [ "$NOW" -ge 1545 ]; then break; fi
            sleep 40
          done
