name: Update data

# Open pages read data/live.json straight from this repository, so a data update
# only needs a commit. One run keeps going all the time and hands over to a fresh run every
# ~5.5 hours: prices about every minute in market hours (full update every ~5 minutes),
# every 4 minutes pre-market, every 10 minutes in the evening, every 30 minutes at night.
# The schedules below are only a backup in case the chain ever breaks.
on:
  schedule:
    # GitHub often starts scheduled runs late or skips them, so weekdays get many chances to
    # start the market loop. A run that starts while a loop is going just waits its turn.
    - cron: "*/20 0-3 * * 1-5"  # 5:30–9:10 AM IST: start the loop early (it waits for the open)
    - cron: "*/30 4-9 * * 1-5"  # 9:30 AM–3:00 PM IST: start the loop if the morning start was missed
    - cron: "0 0-2 * * 0,6"     # weekend mornings: one update
    - cron: "0 11-23/2 * * *"   # every 2 hours in the evening/night: one update (metals, GMP, news)
    - cron: "*/20 11-14 * * 1-5"  # 4:30–8:30 PM IST: catch NSE's FII/DII figures and IBJA evening rates quickly
  push:
    branches: [main]
    paths: [".github/workflows/data.yml", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update (prices ~every minute, full every 5th pass, until 3:45 PM IST)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "marketvedapro-bot"
          git config user.email "marketvedapro-bot@users.noreply.github.com"
          publish_extra() {
              if [ -f out/quotes.json ]; then
                (cd out && rm -rf .git && git init -q -b data && git add -A && git -c user.name=marketvedapro-bot -c user.email=marketvedapro-bot@users.noreply.github.com commit -q -m "All-stock quotes $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')" && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data) || true
                rm -f out/quotes.json
              fi
            }
          i=0
          while true; do
            NOW=$(TZ=Asia/Kolkata date +%H%M); DOW=$(TZ=Asia/Kolkata date +%u)
            MKT=0; if [ "$DOW" -le 5 ] && [ "$NOW" -ge 0900 ] && [ "$NOW" -lt 1545 ]; then MKT=1; fi
            if [ "$MKT" = 1 ] && [ $((i % 5)) -ne 0 ]; then python scripts/update.py --fast || true; else python scripts/update.py || true; fi
            i=$((i+1))
            publish_extra
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "Data update $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')"
            fi
            git pull -q --rebase -X theirs || true   # also picks up script changes
            git push -q || true
            # Jobs stop after ~6 hours: hand over to a fresh run so updates never depend on
            # GitHub's scheduler (which sometimes starts runs late or skips them).
            if [ "$SECONDS" -gt 19800 ]; then
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/data.yml/dispatches" -f ref=main; then break; fi
            fi
            NOW=$(TZ=Asia/Kolkata date +%H%M); DOW=$(TZ=Asia/Kolkata date +%u)
            if [ "$DOW" -le 5 ] && [ "$NOW" -ge 0900 ] && [ "$NOW" -lt 1545 ]; then sleep 40
            elif [ "$DOW" -le 5 ] && [ "$NOW" -ge 0500 ] && [ "$NOW" -lt 0900 ]; then sleep 240
            elif [ "$DOW" -le 5 ] && [ "$NOW" -ge 1545 ] && [ "$NOW" -lt 2100 ]; then sleep 600
            else sleep 1800; fi
          done
