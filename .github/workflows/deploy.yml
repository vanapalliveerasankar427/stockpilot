name: Publish site

# Runs when the site's code changes. Data updates are handled by data.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
  schedule:
    - cron: "13 */3 * * *"   # refresh the search pages (prices, GMP, gold) every 3 hours

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update.py
      - name: Publish all-stock quotes to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_extra() {
            if [ -f out/quotes.json ]; then
              (cd out && rm -rf .git && git init -q -b data && git add -A && git -c user.name=marketvedapro-bot -c user.email=marketvedapro-bot@users.noreply.github.com commit -q -m "All-stock quotes $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')" && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data) || true
              rm -f out/quotes.json
            fi
          }
          publish_extra
      - name: Save data
        run: |
          git config user.name "marketvedapro-bot"
          git config user.email "marketvedapro-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')"
          git push || (git pull --rebase && git push) || true
      - name: IPO calendar for push alerts
        run: node scripts/ipocal.js index.html ipo-calendar.json
      - name: Search engine pages, sitemap and robots.txt
        continue-on-error: true
        run: node --version && node scripts/seo.js .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
