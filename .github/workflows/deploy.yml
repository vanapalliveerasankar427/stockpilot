name: Publish site

# Runs when the site's code changes. Data updates are handled by data.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update.py
      - name: Save data
        run: |
          git config user.name "stockpilot-bot"
          git config user.email "stockpilot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')"
          git push || (git pull --rebase && git push) || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
