name: Update data and publish

on:
  schedule:
    # Every 10 minutes during NSE hours, Mon–Fri (09:00–16:00 IST = 03:30–10:30 UTC)
    - cron: "*/10 3-10 * * 1-5"
    # Every 2 hours the rest of the time (gold, silver, GMP and news still move)
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch fresh figures
        run: python scripts/update.py
      - name: Save data
        run: |
          git config user.name "stockpilot-bot"
          git config user.email "stockpilot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(TZ=Asia/Kolkata date '+%d %b %H:%M IST') [skip ci]"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
