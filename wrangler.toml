# Cloudflare Worker = the allotment relay + push alerts (not the website; the website is on GitHub Pages)
name = "stockpilot"
main = "worker/allotment.js"
compatibility_date = "2026-10-01"
workers_dev = true

# push subscriptions + VAPID key (created automatically on first deploy)
[[kv_namespaces]]
binding = "PUSH"

# every 30 minutes: IPO alerts. Every 5 minutes on weekdays 8:30 AM-12:25 AM IST: price alerts + 8:45 AM / 3:45 PM digests
[triggers]
crons = ["*/30 * * * *", "*/5 3-18 * * 1-5"]
